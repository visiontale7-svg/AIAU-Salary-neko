[package]
name = "dialogue-atlas"
version = "0.1.0"
description = "Evidence-linked local conversation atlas"
authors = ["visiontale7"]
edition = "2024"

[lib]
name = "dialogue_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "uuid", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
keyring = "4"
schemars = { version = "1", features = ["uuid1", "chrono04"] }
once_cell = "1"
url = "2"
tempfile = "3"
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1"
